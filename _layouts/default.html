<!DOCTYPE html>
<html lang="en">
<!-- Adapted from https://github.com/luost26/academic-homepage (MIT). -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.data.profile.navbar_name | escape }}</title>
  <meta name="description" content="{{ site.description | strip_newlines | escape }}">
  <meta name="theme-color" content="#f5f7fa">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.data.profile.primary_name | escape }} · {{ page.title | escape }}">
  <meta property="og:description" content="{{ site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.data.profile.portrait_url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include navbar.html %}
  <main id="main" class="container-lg flex-grow-1" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/common.js' | relative_url }}" defer></script>
</body>
</html>
