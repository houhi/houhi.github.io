short_bio: >-
  <p>I am a master's student in Computer Science and Technology at the
  <a href="https://www.uestc.edu.cn/">University of Electronic Science and Technology of China (UESTC)</a>,
  advised by <a href="https://scholar.google.com/citations?user=LdqJFMIAAAAJ">Prof. Jie Zou</a>.
  I received my bachelor's degree in Information Management and Information Systems from
  <a href="https://www.bjfu.edu.cn/">Beijing Forestry University</a> in 2024.</p>
  <p>My research focuses on <strong>generative recommendation</strong> and
  <strong>LLM-based recommender systems</strong>. I am particularly interested in semantic IDs,
  efficient model architectures, reinforcement learning post-training, and personalized multi-agent systems.</p>
  <p>I am currently a research intern at <strong>Tencent Ads</strong>. Previously, I worked on
  generative recommendation at <strong>JD.com</strong>. My work connects academic research with
  recommendation systems at an industrial scale.</p>
